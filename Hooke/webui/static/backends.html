<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hooke · 双后端实验室</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#18212d;--line:#304155;--text:#edf3fa;--muted:#aebed0;--accent:#71dfbf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:30px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:0}h2{font-size:20px;margin:0}p{margin:8px 0}a{color:var(--accent)}.muted{color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 120px;gap:16px;margin:24px 0}.controls label{display:block;font-size:13px;color:var(--muted)}select,input,button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 12px;background:#111a25;color:var(--text)}select,input{width:100%}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#10241f;font-weight:650}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;padding:17px 20px}.tag{font-size:12px;color:var(--accent)}.viewport{aspect-ratio:4/3;background:#0a0e14;position:relative;display:flex;align-items:center;justify-content:center}.viewport img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.placeholder{color:var(--muted);padding:25px;text-align:center}.panel-body{padding:16px 20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:54px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:flex;gap:20px;color:var(--muted);font-size:13px}.notice{border-left:3px solid #dfb975;padding:10px 16px;background:#24231e;margin:18px 0}details{margin-top:12px}pre{font-size:12px;overflow:auto;max-height:260px;white-space:pre-wrap}.camera{display:flex;align-items:center;gap:8px;margin:10px 0}.camera select{max-width:260px}.scrub{display:none;margin-top:10px}.error{color:#ffb9ad}footer{margin-top:24px;color:var(--muted);font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:20px 12px}header{align-items:flex-start;flex-direction:column}h1{font-size:23px}.controls{grid-template-columns:1fr 90px}}
</style>
</head>
<body><main>
<header><div><h1>Hooke 双后端实验室</h1><p class="muted">同一份场景资产、同一个任务控制器，分别运行 MuJoCo 与 Isaac。</p></div><div><a href="/space-experiments">空间实验操作 ↗</a> · <a href="/space-assets">开源空间资产 ↗</a> · <a href="/space-worlds">太空实验工作区 ↗</a> · <a href="/">返回场景选择器 ↗</a></div></header>
<p id="backend-environment" class="muted" role="status">正在检查服务器的 Isaac 配置…</p>
<details id="backend-environment-details"><summary>服务器环境与配置帮助</summary><pre id="backend-environment-report"></pre><button id="backend-environment-refresh">重新检查</button></details>
<div class="controls"><div><label for="task">场景 / 任务</label><select id="task"></select></div><div><label for="seed">随机种子</label><input id="seed" type="number" min="0" max="2147483647" value="0"></div></div>
<p id="description" class="muted"></p><div id="notice" class="notice"></div>
<p id="validation" class="muted"></p>
<label for="science">运行内容</label><select id="science"><option value="">原机械任务</option><option value="thermal">简化热学：33°C，90 秒（未标定）</option><option value="capillary">简化流体：5 kPa 毛细管连接，5 秒（未标定）</option></select><p id="science-notice" class="muted" hidden></p>
<div class="actions" style="margin-bottom:18px"><button id="open-both">依次打开两边</button><button id="run-both">依次运行双后端</button></div>
<div class="grid" id="panels"></div>
<footer><p id="coverage">正在读取场景验证结果…</p><p>画面由服务器真实渲染。点击运行后会持续更新；完成后可拖动时间轴查看。首次启动 Isaac 需要等待环境加载。</p></footer>
</main>
<script src="/backend-environment.js" defer></script>
<script>
const $=id=>document.getElementById(id), states={}, labels={STARTING:'正在启动仿真环境…',RUNNING:'运行中',TASK_SUCCEEDED:'原任务判据通过',TASK_FAILED:'原任务判据未通过',PREVIEW_COMPLETE:'场景已加载并推进物理',DISPLAY_COMPLETE:'展示场景已运行',ERROR:'运行出错',CANCELLED:'已停止',TIME_LIMIT:'达到运行时限',INTERRUPTED:'任务已中断',STOPPED:'已停止',INVALIDATED:'旧验证结果已撤销，正在复测'};
labels.CONTROL_COMPLETE='模型实验已完成';
let catalog=[],pairRunning=false;
$('open-both').onclick=()=>runPair('preview');
$('run-both').onclick=()=>runPair('expert');
for(const backend of ['mujoco','isaac']){
 const title=backend==='isaac'?'Isaac · PhysX':'MuJoCo';states[backend]={job:null,timer:null,camera:null,images:[],running:false};
 const panel=document.createElement('section');panel.className='panel';panel.innerHTML=`<div class="panel-head"><h2>${title}</h2><span class="tag">${backend==='isaac'?'实验适配':'原始后端'}</span></div><div class="viewport"><span class="placeholder" id="${backend}-placeholder">点击“打开场景”查看实际画面</span><img id="${backend}-image" hidden alt="${title} 实际渲染画面"></div><div class="panel-body"><div class="actions"><button id="${backend}-preview">打开场景</button><button class="primary" id="${backend}-run">运行原任务</button><button id="${backend}-stop" disabled>停止</button></div><div class="camera"><label for="${backend}-camera">视角</label><select id="${backend}-camera"><option>主视角</option></select></div><div class="scrub" id="${backend}-scrub"><label id="${backend}-frame-label">回看帧</label><input id="${backend}-frame" type="range" min="0" value="0"></div><div class="status" id="${backend}-status">尚未运行</div><div class="stats" id="${backend}-stats"></div><div class="muted" id="${backend}-instrument"></div><details><summary>运行记录</summary><pre id="${backend}-details">暂无记录</pre></details></div>`;$('panels').append(panel);
 $(backend+'-preview').onclick=()=>start(backend,'preview');$(backend+'-run').onclick=()=>start(backend,'expert');
 $(backend+'-stop').onclick=async()=>{try{const r=await api(`/api/backends/jobs/${states[backend].job}/stop`,{});update(backend,r)}catch(e){error(backend,e)}};
 $(backend+'-camera').onchange=()=>{states[backend].camera=Number($(backend+'-camera').value);showImage(backend)};
 $(backend+'-frame').oninput=()=>showImage(backend,Number($(backend+'-frame').value));
}
async function api(url,body){const response=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||response.statusText);return data}
function error(b,e){$(b+'-status').textContent=e.message;$(b+'-status').classList.add('error')}
function remember(){try{localStorage.setItem('hooke-backend-session',JSON.stringify({task:$('task').value,seed:$('seed').value,jobs:Object.fromEntries(Object.entries(states).map(([b,s])=>[b,s.job]))}))}catch(e){}}
async function runPair(mode){pairRunning=true;try{for(const b of ['mujoco','isaac']){const id=await start(b,mode);if(!id)return;while(states[b].job===id&&states[b].running)await new Promise(resolve=>setTimeout(resolve,250));if(states[b].job!==id||['ERROR','TIME_LIMIT','STOPPED','CANCELLED','INTERRUPTED'].includes(states[b].latest?.status))return}}finally{pairRunning=false;for(const b of ['mujoco','isaac'])if(states[b].latest)update(b,states[b].latest)}}
async function start(b,mode){if(mode==='expert'&&$('science').value)mode='experiment';$(b+'-status').classList.remove('error');$(b+'-status').textContent='正在提交…';try{const data=await api('/api/backends/jobs',{task:$('task').value,seed:Number($('seed').value),backend:b,mode,science_model:$('science').value,seconds:2});states[b].job=data.id;states[b].camera=null;clearTimeout(states[b].timer);remember();update(b,data);poll(b);return data.id}catch(e){error(b,e);return null}}
async function poll(b){try{const data=await api('/api/backends/jobs/'+states[b].job);update(b,data);if(data.running)states[b].timer=setTimeout(()=>poll(b),1500)}catch(e){error(b,e);states[b].timer=setTimeout(()=>poll(b),3000)}}
function update(b,data){const s=states[b];s.latest=data;s.running=data.running;s.fps=data.render_settings?.frames_per_second||20;s.images=data.images||[];s.cameras=data.cameras||[];$(b+'-preview').disabled=s.running||pairRunning;$(b+'-run').disabled=s.running||pairRunning;$(b+'-stop').disabled=!s.running;$('task').disabled=pairRunning||Object.values(states).some(x=>x.running);$('seed').disabled=$('task').disabled;$('science').disabled=$('task').disabled;$('open-both').disabled=$('task').disabled;$('run-both').disabled=$('task').disabled;
 $(b+'-status').textContent=(labels[data.status]||data.status)+(data.error?'\n'+data.error:'')+(data.display_only?'\n此场景没有交互任务，完成状态表示物理展示结束。':'')+(data.within_declared_time_limit===false?'\n超过原任务声明的仿真时限。':'');
 if(!data.running&&data.mode==='expert'&&['TASK_SUCCEEDED','TASK_FAILED'].includes(data.status)){
  const a=data.assessment;
  if(a?.success!==null&&typeof a?.success==='boolean'){
   $(b+'-status').textContent+='\n新版操作判据：'+(a.success?'通过':'未通过')+(a.scope==='motion_sequence_proxy'?'（动作顺序）':'')+(a.success&&a.success_within_time_limit===false?'，但超过任务时限':'');
   const reasons={ordered_submerge_release_withdraw:'浸入、液面下释放、抬起的动作顺序',final_clearance_50mm:'最终离开液面超过 50 mm',liquid_available:'容器内有液体',target_within_20mm:'窗位置距目标小于 20 mm',handle_contact_50ms:'夹爪接触把手至少 50 ms',travel_in_contact_50mm:'接触期间关窗位移至少 50 mm',tube_lifted_30mm:'试管抬起超过 30 mm',continuous_rotating_tube_contact_500ms:'试管连续接触旋转平台至少 500 ms',returned_within_30mm:'归位误差小于 30 mm',tube_released:'释放试管',platform_stopped:'平台停止',height_955_to_961mm:'试管高度在 0.955–0.961 m 内',target_within_5mm:'距当前转子槽位的误差小于 5 mm',tube_axis_within_5deg:'试管轴线倾角小于 5°',seated_stable_500ms:'释放后在槽位内稳定至少 500 ms'};
   if(a.failure_reasons?.length)$(b+'-status').textContent+='\n未满足项：'+a.failure_reasons.map(k=>reasons[k]||k).join('、');
  }else $(b+'-status').textContent+='\n新版操作判据：尚未覆盖此任务。';
  const volume=data.volume_assessment;
  if(volume){
   const m=volume.metrics,tip=m.reservoirs.tip.volume_m3*1e9;
   $(b+'-status').textContent+=`\n液量模型：${volume.success?'通过':'未通过'} · 吸头内 ${tip.toFixed(1)} µL · 容器内 ${(m.reservoirs.source.volume_m3*1e6).toFixed(3)} mL`;
   if(m.target_reservoir&&m.target_reservoir!=='tip'){const target=m.target_reservoir,delivered=m.reservoirs[target].volume_m3-(m.initial_volumes_m3?.[target]||0);$(b+'-status').textContent+=`\n目标容器净接收 ${(delivered*1e9).toFixed(3)} µL`}
   if(Number.isFinite(m.max_geometric_volume_error_m3))$(b+'-status').textContent+=`\n液面几何体积最大误差 ${(m.max_geometric_volume_error_m3*1e9).toFixed(6)} µL`;
   $(b+'-status').textContent+='\n体积模型读取实际按钮位移；真实流体与移液精度待校准。';
  }
 }
 const science=data.progress?.scientific_model||data.scientific_model;if(science){$(b+'-status').textContent+='\n简化模型：'+(science.valid?'适用条件内':'超出适用条件')+'，参数未经过仪器标定。';if(Number.isFinite(science.sample_c))$(b+'-status').textContent+=`\n样品 ${science.sample_c.toFixed(3)} °C · 能量残差 ${science.energy_residual_j.toExponential(2)} J`;if(Number.isFinite(science.transferred_m3))$(b+'-status').textContent+=`\n转移 ${(science.transferred_m3*1e9).toFixed(3)} µL · 体积残差 ${science.conservation_error_m3.toExponential(2)} m³`;}const progress=data.running?data.progress:data;const t=progress?.simulation_s??data.simulation_s??0, steps=progress?.steps??data.steps??0;const wall=data.running?Math.max(0,Date.now()/1000-data.created):data.total_wall_s;$(b+'-stats').textContent=`仿真时间 ${t.toFixed(3)} 秒　·　${steps} 步　·　${s.images[0]?.frames||0} 帧`+(Number.isFinite(wall)?`　·　实际耗时 ${wall.toFixed(1)} 秒`:'');
 const instrument=(data.running?data.progress?.instrument_state:(data.instrument_state??data.progress?.instrument_state))?.main_parameter;
 $(b+'-instrument').textContent=instrument?`仪器设定：${instrument.frequency} RPM · ${instrument.set_temperature} °C · ${instrument.time.seconds} 秒`:'';
 const mission=data.running?data.progress?.surface_mission:data.surface_mission;
 if(mission)$(b+'-instrument').textContent=`采样探索 · ${mission.phase||data.expert_phases?.at(-1)?.phase||'待命'} · 已行驶 ${mission.traveled_m.toFixed(2)} 米 · 岩样${mission.sample_in_bin?'已入舱':'未入舱'}`;
 const space=data.running?data.progress?.space_experiment:data.space_experiment;
 if(space){if(space.phase)$(b+'-instrument').textContent=`阶段 ${space.phase} · 插槽 ${space.loaded_sample_id||'空载'} · 已记录 ${space.recorded_measurements} 次测量`;const conclusion=space.conclusion;if(Number.isFinite(conclusion?.total_mass_kg))$(b+'-instrument').textContent=`质量估计 ${(conclusion.total_mass_kg*1000).toFixed(3)} g · 依据 ${conclusion.measurement_ids.join('、')}`;if(conclusion?.scores_rms)$(b+'-instrument').textContent=conclusion.abstained?'解析测试曲线未匹配，报告不确定':`解析测试曲线匹配：${conclusion.match}`;}
 $(b+'-details').textContent=JSON.stringify(data,null,2);
 const select=$(b+'-camera');select.replaceChildren(...s.images.map(c=>{const option=document.createElement('option');option.value=c.id;option.textContent=s.cameras.find(x=>x.id===c.id)?.name||'相机 '+c.id;return option}));
 if(s.camera===null||!s.images.some(x=>x.id===s.camera)){const preferred=s.cameras[0]?.id;s.camera=s.images.some(x=>x.id===preferred)?preferred:s.images[0]?.id}select.value=s.camera;showImage(b);
 $(b+'-scrub').style.display=!s.running&&s.images.length?'block':'none';
}
function showImage(b,frame){const s=states[b],camera=s.images.find(x=>x.id===s.camera);if(!camera)return;const max=camera.frames-1;$(b+'-frame').max=max;frame=frame===undefined?max:Math.min(max,frame);$(b+'-frame').value=frame;$(b+'-frame-label').textContent=`回看 ${(frame/(s.fps||20)).toFixed(2)} 秒 · 第 ${frame+1} / ${max+1} 帧`;$(b+'-image').src=`/api/backends/jobs/${s.job}/image/${camera.id}/${frame}`;$(b+'-image').hidden=false;$(b+'-placeholder').hidden=true}
function selection(){const task=catalog.find(x=>x.name===$('task').value);if(!task)return;$('description').textContent=task.description;for(const o of $('science').options)o.disabled=!!o.value&&((o.value==='thermal'&&task.name!=='thermal_mixer')||(o.value==='capillary'&&task.name!=='pipette_transfer'));if($('science').selectedOptions[0]?.disabled)$('science').value='';const text=task.display_only?'这是原项目的展示场景，没有交互控制器。“运行原任务”将推进 2 秒物理。':task.completion_rule==='surface_sampling'?'六轮采样车实际行驶至采样点，抓取地面岩样、提升并存入车载容器，再返回着陆区；按移动、接触、入舱与停车状态判定完成。':task.completion_rule==='space_experiment'?'机器人按实际接触完成抓取、装载、锁定、测量与取回；空间站采用惯性测量，月球和火星采用弹性支撑。光谱使用解析测试曲线。':task.shared_process_progress?'任务按实际操作顺序、接触和终态判定完成，两个后端使用相同判定规则。':task.completion_rule==='centrifuge_cycle'?'完整流程：装样、配平、关盖锁盖、60 RPM 实际旋转、制动和安全解锁；新增样品固定机构采用未标定约束。':task.completion_rule==='lid_standstill_geometry'?'任务按实际盖板角度和停止状态判定完成。':task.completion_rule==='lid_lock_geometry'?'任务按实际盖板角度和锁盖状态判定成功。':task.check_constant_true?'原任务的成功检查恒为真，不能据此判断操作成功。':task.check_constant_false?'原任务尚未实现成功判据（check 固定返回 false），运行结束不会显示任务成功。':'运行会使用原任务控制器；任务判据通过后，仍需分别验证动作、接触、速度和视觉一致性。';$('notice').textContent=text+' 两种引擎的动力学参数和真实仪器精度仍需独立标定。';scienceSelection();
 $('validation').textContent=task.display_only?'': '最近一次原任务验证（种子 0）：'+['mujoco','isaac'].map(b=>{const r=task.expert_validation?.[b];return (b==='isaac'?'Isaac':'MuJoCo')+' '+(r?(labels[r.status]||r.status)+(typeof r.simulation_s==='number'?'，'+r.simulation_s.toFixed(3)+' 秒仿真':'')+(r.within_declared_time_limit===false?'（超过原声明时限）':''):'尚无完整结果')}).join('；');
 for(const b of ['mujoco','isaac']){clearTimeout(states[b].timer);states[b].job=null;states[b].images=[];$(b+'-image').hidden=true;$(b+'-placeholder').hidden=false;$(b+'-status').textContent='尚未运行';$(b+'-stats').textContent='';$(b+'-instrument').textContent='';$(b+'-details').textContent='暂无记录';$(b+'-scrub').style.display='none'}
 if(task.isaac?.status?.startsWith('LOAD_STEP')&&Number($('seed').value)===0){const img=$('isaac-image');img.onload=()=>{$('isaac-placeholder').hidden=true;img.hidden=false};img.onerror=()=>{img.hidden=true;$('isaac-placeholder').hidden=false};img.src='/api/backends/preview/'+encodeURIComponent(task.name);$('isaac-status').textContent='已验证加载和物理推进 · 当前显示种子 0 的缓存截图'}
}
async function load(){const data=await api('/api/backends/catalog');catalog=data.tasks;const groups=new Map();for(const task of catalog){if(!groups.has(task.category)){const group=document.createElement('optgroup');group.label=task.category;groups.set(task.category,group)}const option=document.createElement('option');option.value=task.name;option.textContent=task.name+(task.display_only?' · 展示':'');groups.get(task.category).append(option)}$('task').replaceChildren(...groups.values());let saved={};try{saved=JSON.parse(localStorage.getItem('hooke-backend-session'))||{}}catch(e){}const requested=new URLSearchParams(location.search).get('task');$('task').value=catalog.some(t=>t.name===requested)?requested:catalog.some(t=>t.name===saved.task)?saved.task:'hplc_injector_plunger';$('seed').value=saved.seed||0;selection();$('coverage').textContent=`场景库 ${data.total} 项 · Isaac 已验证加载、推进与渲染 ${data.passed} 项 · 完整物理等价尚未验收`;for(const b of ['mujoco','isaac']){if(saved.jobs?.[b]){try{const job=await api('/api/backends/jobs/'+saved.jobs[b]);if(job.task===$('task').value){states[b].job=job.id;update(b,job);if(job.running)poll(b)}}catch(e){error(b,e)}}}}
function scienceSelection(){const mode=$('science').value;for(const b of ['mujoco','isaac'])$(b+'-run').textContent=mode?'运行模型实验':'运行原任务';$('run-both').textContent=mode?'依次运行模型实验':'依次运行双后端';$('science-notice').hidden=!mode;$('science-notice').textContent=mode==='thermal'?'模型边界：33°C 加热程序，观察 90 秒。参数未标定，机器人设定程序的动作另行验收。':mode==='capillary'?'模型边界：原容器通过充满液体的毛细管连接，给定 5 kPa 压差，观察 5 秒。参数未标定，未计入机械质量反馈。':''}
$('science').onchange=scienceSelection;
function changeSelection(){selection();try{localStorage.removeItem('hooke-backend-session')}catch(e){}}
$('task').onchange=changeSelection;$('seed').onchange=changeSelection;load().catch(e=>{$('coverage').textContent=e.message});
</script></body></html>
