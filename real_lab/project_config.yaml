# --- Honest scope note (not part of the guide's own template, added here) ---
# This pilot covers Section 1-8 of private/real_lab_reconstruction_collaboration_guide.md:
# building the candidate pool and identifying real labs per school, with sourced
# evidence pointers (URLs, what each source does/doesn't confirm).
#
# It does NOT cover Sections 9-11 (actual 3D space/equipment reconstruction,
# mechanical validation, high-fidelity checks) -- that requires real CAD/asset
# tooling and per-equipment manufacturer research this session doesn't have.
# Producing fabricated "3D scenes" without that evidence chain would violate
# the guide's own core principle (Section 1.2, item 7: "record uncertainty",
# and Section 6.5: "do not cover material gaps by mirroring, adding arbitrary
# equipment, or splicing unrelated rooms").
